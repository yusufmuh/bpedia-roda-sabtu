name: roda_sabtu
description: >-
  Roda Sabtu untuk Bpedia Demo v3. Aturan murni putaran gratis tiap Sabtu WIB
  (peluang, kuota produk, hadiah cadangan, irisan roda) dan halaman game siap
  pakai: roda 3D mengilap, lampu tepi, Bipy bergerak, lembar hasil.
version: 3.0.0
repository: https://github.com/yusufmuh/bpedia-roda-sabtu
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bipy/
    - assets/art/
    - assets/fx/
